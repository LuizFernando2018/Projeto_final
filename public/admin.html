<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopet - Gerenciamento de Animais (Admin)</title>
    <link rel="stylesheet" href="./assets/css/cadastro/cadastro_admin.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="./js/Usuario/auth.js" defer></script>
</head>
<body>
   
        <h1>Gerenciamento de Animais (Admin)</h1>
        <button id="adminLogoutBtn">Logout</button>
    
    <div id="mensagem"></div>

  <section>
    <h2>Cadastrar Novo Animal</h2>
    <form id="form-animal">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" required>

      <label for="especie">Espécie:</label>
      <input type="text" id="especie" required>

      <label for="idade">Idade:</label>
      <input type="text" id="idade">

      <label for="descricao">Descrição:</label>
      <textarea id="descricao"></textarea>

      <label for="status">Status:</label>
      <select id="status">
        <option value="disponivel">Disponível</option>
        <option value="adotado">Adotado</option>
        <option value="pendente">Pendente</option>
      </select>

      <label for="localizacao">Localização:</label>
      <input type="text" id="localizacao">

      <label for="animalImage">Imagem do Animal:</label>
      <div>
            <input type="file" id="animalImage" name="animalImage" accept="image/jpeg, image/png, image/gif, image/webp" style="display: none;">
            <button type="button" class="custom-file-upload-btn" data-target-file-input="animalImage">Selecionar Imagem</button>
            <span id="fileNameAnimalImage" class="file-name-display">Nenhum arquivo selecionado</span>
      </div>

      <button type="submit">Cadastrar Animal</button>
    </form>
  </section>

  <section>
    <h2>Editar Animal</h2>
    <form id="form-editar-animal">
      <input type="hidden" id="edit-id">
      <label for="edit-nome">Nome:</label>
      <input type="text" id="edit-nome" required>

      <label for="edit-especie">Espécie:</label>
      <input type="text" id="edit-especie" required>

      <label for="edit-idade">Idade:</label>
      <input type="text" id="edit-idade">

      <label for="edit-descricao">Descrição:</label>
      <textarea id="edit-descricao"></textarea>

      <label for="edit-status">Status:</label>
      <select id="edit-status">
        <option value="disponivel">Disponível</option>
        <option value="adotado">Adotado</option>
        <option value="pendente">Pendente</option>
      </select>

      <label for="edit-localizacao">Localização:</label>
      <input type="text" id="edit-localizacao">

      <div>
            <label>Imagem Atual:</label>
            <img id="currentAnimalImagePreview" src="#" alt="Imagem atual do animal" style="max-width: 100px; max-height: 100px; display: none;">
            <p id="noCurrentImageText" style="display: none;">Nenhuma imagem cadastrada.</p>
      </div>
      <label for="editAnimalImage">Nova Imagem (opcional):</label>
      <div>
            <input type="file" id="editAnimalImage" name="animalImage" accept="image/jpeg, image/png, image/gif, image/webp" style="display: none;">
            <button type="button" class="custom-file-upload-btn" data-target-file-input="editAnimalImage">Selecionar Imagem</button>
            <span id="fileNameEditAnimalImage" class="file-name-display">Nenhum arquivo selecionado</span>
      </div>

      <button type="submit">Salvar Alterações</button>
      <button type="button" onclick="cancelarEdicao()">Cancelar</button>
    </form>
  </section>

  <section>
    <h2>Lista de Animais</h2>
    <table id="tabela-animais">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Espécie</th>
          <th>Idade</th>
          <th>Descrição</th>
          <th>Status</th>
          <th>Localização</th> <!-- Added this header -->
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
    function handleAdminLogout() {
      console.log('Admin logout initiated...');
      localStorage.removeItem('token');
      localStorage.removeItem('userId');
      // alert('Você foi desconectado.'); // Optional: matches behavior in perfil.html
      window.location.href = 'index.html';
    }

    // Verifica o token imediatamente
    const token = localStorage.getItem('token');
    if (!token) {
      console.log('Token não encontrado no localStorage. Redirecionando para login.html...');
      document.body.innerHTML = `<p style="color: red; text-align: center;">Você precisa estar logado para acessar esta página. Redirecionando para o login...</p>`;
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    } else {
      console.log('Token encontrado. Inicializando página de gerenciamento de animais...');

      // Attach logout button listener
      const adminLogoutButton = document.getElementById('adminLogoutBtn');
      if (adminLogoutButton) {
        adminLogoutButton.addEventListener('click', handleAdminLogout);
      } else {
        console.error('Admin logout button (#adminLogoutBtn) not found in admin.html.');
      }

      inicializarPagina(); // Call to initialize page content
    }

    function setupCustomFileInputs() {
        document.querySelectorAll('.custom-file-upload-btn').forEach(button => {
            const targetInputId = button.getAttribute('data-target-file-input');
            const fileInput = document.getElementById(targetInputId);
            const fileNameDisplayId = 'fileName' + targetInputId.charAt(0).toUpperCase() + targetInputId.slice(1); // e.g., fileNameAnimalImage
            const fileNameDisplay = document.getElementById(fileNameDisplayId);

            if (fileInput) {
                button.addEventListener('click', () => {
                    fileInput.click(); // Trigger click on the hidden file input
                });

                fileInput.addEventListener('change', () => {
                    if (fileInput.files.length > 0) {
                        if (fileNameDisplay) {
                            fileNameDisplay.textContent = fileInput.files[0].name;
                        }
                    } else {
                        if (fileNameDisplay) {
                            fileNameDisplay.textContent = 'Nenhum arquivo selecionado';
                        }
                    }
                });
            }
        });
    }

    function inicializarPagina() {
      const mensagemDiv = document.getElementById('mensagem');
      const tabelaAnimais = document.querySelector('#tabela-animais tbody');
      const formEditar = document.getElementById('form-editar-animal');
      const formCadastrar = document.getElementById('form-animal');

      mensagemDiv.innerHTML = `<p style="color: #555;">Carregando lista de animais...</p>`;
      carregarAnimais();

      async function carregarAnimais() {
        try {
          const response = await fetch('http://localhost:3000/animais/admin', {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          if (!response.ok) {
            throw new Error(`Erro: ${response.status} - ${response.statusText}`);
          }
          const animais = await response.json();
          tabelaAnimais.innerHTML = '';
          animais.forEach(animal => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${animal.id}</td>
              <td>${animal.nome}</td>
              <td>${animal.especie}</td>
              <td>${animal.idade || '-'}</td>
              <td>${animal.descricao || '-'}</td>
              <td>${animal.status}</td>
              <td>${animal.localizacao || '-'}</td> <!-- Added this cell -->
              <td>
                <button class="edit" onclick="editarAnimal(${animal.id})">Editar</button>
                <button class="delete" onclick="deletarAnimal(${animal.id})">Deletar</button>
              </td>
            `;
            tabelaAnimais.appendChild(row);
          });
          mensagemDiv.innerHTML = `<p style="color: green;">Lista de animais carregada com sucesso!</p>`;
        } catch (err) {
          console.error('Erro ao carregar animais:', err);
          mensagemDiv.innerHTML = `<p style="color: red;">Erro ao carregar animais: ${err.message}</p>`;
          tabelaAnimais.innerHTML = '';
        }
      }

      formCadastrar.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData();
        formData.append('nome', document.getElementById('nome').value);
        formData.append('especie', document.getElementById('especie').value);
        formData.append('idade', document.getElementById('idade').value);
        formData.append('descricao', document.getElementById('descricao').value);
        formData.append('status', document.getElementById('status').value);
        formData.append('localizacao', document.getElementById('localizacao').value);

        const imageInput = document.getElementById('animalImage');
        if (imageInput.files[0]) {
          formData.append('animalImage', imageInput.files[0]);
        }

        try {
          const response = await fetch('http://localhost:3000/animais', {
            method: 'POST',
            headers: {
              // 'Content-Type': 'application/json' IS REMOVED for FormData + file upload
              'Authorization': `Bearer ${token}`
            },
            body: formData // Send FormData object
          });
          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ error: response.statusText })); // Try to parse error
            throw new Error(errorData.error || `Erro HTTP: ${response.status}`);
          }
          const result = await response.json();
          mensagemDiv.innerHTML = `<p style="color: green;">Animal cadastrado com sucesso! ID: ${result.id}</p>`;
          formCadastrar.reset();
          carregarAnimais();
        } catch (err) {
          console.error('Erro ao cadastrar animal:', err);
          mensagemDiv.innerHTML = `<p style="color: red;">Erro ao conectar com o servidor: ${err.message}</p>`;
        }
      });

      window.editarAnimal = async (id) => {
        try {
          const response = await fetch(`http://localhost:3000/animais/${id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!response.ok) {
            throw new Error(`Erro: ${response.status} - ${response.statusText}`);
          }
          const animal = await response.json();
          document.getElementById('edit-id').value = animal.id;
          document.getElementById('edit-nome').value = animal.nome;
          document.getElementById('edit-especie').value = animal.especie;
          document.getElementById('edit-idade').value = animal.idade || '';
          document.getElementById('edit-descricao').value = animal.descricao || '';
          document.getElementById('edit-status').value = animal.status;
          document.getElementById('edit-localizacao').value = animal.localizacao || '';

          const currentImagePreview = document.getElementById('currentAnimalImagePreview');
          const noCurrentImageText = document.getElementById('noCurrentImageText');
          if (animal.imagem_url) {
            currentImagePreview.src = animal.imagem_url;
            currentImagePreview.style.display = 'block';
            noCurrentImageText.style.display = 'none';
          } else {
            currentImagePreview.style.display = 'none';
            noCurrentImageText.style.display = 'block';
          }
          document.getElementById('editAnimalImage').value = ''; // Clear file input

          formEditar.style.display = 'block';
          formCadastrar.style.display = 'none';
        } catch (err) {
          console.error('Erro ao buscar animal para edição:', err);
          mensagemDiv.innerHTML = `<p style="color: red;">Erro ao carregar animal: ${err.message}</p>`;
        }
      };

      formEditar.addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('edit-id').value;
        const formData = new FormData();
        formData.append('nome', document.getElementById('edit-nome').value);
        formData.append('especie', document.getElementById('edit-especie').value);
        formData.append('idade', document.getElementById('edit-idade').value);
        formData.append('descricao', document.getElementById('edit-descricao').value);
        formData.append('status', document.getElementById('edit-status').value);
        formData.append('localizacao', document.getElementById('edit-localizacao').value);

        const editImageInput = document.getElementById('editAnimalImage');
        if (editImageInput.files[0]) {
          formData.append('animalImage', editImageInput.files[0]);
        }

        try {
          const response = await fetch(`http://localhost:3000/animais/${id}`, {
            method: 'PUT',
            headers: {
              // 'Content-Type': 'application/json' IS REMOVED for FormData
              'Authorization': `Bearer ${token}`
            },
            body: formData
          });
          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ error: response.statusText })); // Try to parse error
            throw new Error(errorData.error || `Erro HTTP: ${response.status}`);
          }
          const result = await response.json();
          mensagemDiv.innerHTML = `<p style="color: green;">Animal atualizado com sucesso!</p>`;
          formEditar.style.display = 'none';
          formCadastrar.style.display = 'block';
          carregarAnimais();
        } catch (err) {
          console.error('Erro ao atualizar animal:', err);
          mensagemDiv.innerHTML = `<p style="color: red;">Erro ao atualizar animal: ${err.message}</p>`;
        }
      });

      window.cancelarEdicao = () => {
        formEditar.style.display = 'none';
        formCadastrar.style.display = 'block';
        mensagemDiv.innerHTML = `<p style="color: green;">Lista de animais carregada com sucesso!</p>`;
        carregarAnimais();
      };

      window.deletarAnimal = async (id) => {
        if (!confirm('Tem certeza que deseja deletar este animal?')) return;

        try {
          const response = await fetch(`http://localhost:3000/animais/${id}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          if (!response.ok) {
            throw new Error(`Erro: ${response.status} - ${response.statusText}`);
          }
          const result = await response.json();
          mensagemDiv.innerHTML = `<p style="color: green;">Animal deletado com sucesso!</p>`;
          carregarAnimais();
        } catch (err) {
          console.error('Erro ao deletar animal:', err);
          mensagemDiv.innerHTML = `<p style="color: red;">Erro ao deletar animal: ${err.message}</p>`;
        }
      };
      setupCustomFileInputs(); // Call here
    }
  </script>
</body>
</html>
