<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Adopet</title>
    <link rel="stylesheet" href="./assets/css/normalize.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="cadastro">
    <div id="acessibilidade"></div>
    <header>
        <div class="forma__topo"></div>
        <div class="forma__lateral esquerda"></div>
        <div class="patas"></div>
        <nav class="cabecalho container__cabecalho">
            <ul class="cabecalho__menu" id="logado">
                <li class="cabecalho__menu--item menu--logo" id="logo"></li>
                <li class="cabecalho__menu--item"></a></li>
                <li class="cabecalho__menu--item"><a href="./mensagem.html" aria-label="Enviar Mensagens"></a></li>
                <li class="cabecalho__menu--item"><a href="./mensagensResponsavel.html" aria-label="Ver Mensagens Recebidas"></a></li>
                <li class="cabecalho__menu--item" id="perfil"></a></li>
            </ul>
        </nav>
    </header>
    <main class="conteudo">
        <section class="cadastro__texto container__cadastro">
            <div class="cadastro__logo">
                <img src="assets/img/Truepet-removebg-preview.png.jpeg" alt="Logo TruePet" style="max-width: 300px; height: auto;">
            </div>
            <p class="cadastro__texto--paragrafo">Ainda não tem cadastro?</p>
            <p class="cadastro__texto--paragrafo">Então, antes de buscar seu melhor amigo, precisamos de alguns dados:</p>
        </section>
        <section>
            <form data-formCadastro class="cadastro__formulario container__cadastro">
                <div class="input-container">
                    <label for="nome" class="formulario__loggedout--campo">Nome</label>
                    <input type="text" data-type="nome" class="formulario__loggedout--input input" id="nome"
                        placeholder="Digite seu nome completo" required>
                    <span class="input-mensagem-erro"></span>
                </div>
                <div class="input-container">
                    <label for="email" class="formulario__loggedout--campo">Email</label>
                    <input type="email" data-type="email" class="formulario__loggedout--input input" id="email" name="email"
                        placeholder="Insira seu email" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,4}$" title="Por favor, insira um email válido (exemplo: nome@dominio.com)" required>
                    <span class="input-mensagem-erro"></span>
                </div>
                <div class="input-container">
                    <label for="senha" class="formulario__loggedout--campo">Senha</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input data-type="senha" type="password" class="formulario__loggedout--input input" id="senha" placeholder="Crie uma senha" required pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,12}$" title="Deve conter ao menos um número, uma letra maiúscula e minúscula, e entre 8 e 12 caracteres" style="padding-right: 30px;">
                        <span class="toggle-password-visibility" data-target-input="senha" style="position: absolute; right: 10px; cursor: pointer;">
                            <img src="assets/img/Olho.svg" alt="Mostrar/Ocultar Senha" style="width: 20px; height: auto;">
                        </span>
                    </div>
                    <span class="input-mensagem-erro"></span>
                </div>
                <div class="input-container">
                    <label for="confirmaSenha" class="formulario__loggedout--campo">Confirme sua senha</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input data-type="confirmaSenha" type="password" class="formulario__loggedout--input input" id="confirmaSenha" placeholder="Confirme sua senha" required pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,12}$" title="As senhas devem ser idênticas" style="padding-right: 30px;">
                        <span class="toggle-password-visibility" data-target-input="confirmaSenha" style="position: absolute; right: 10px; cursor: pointer;">
                            <img src="assets/img/Olho.svg" alt="Mostrar/Ocultar Senha" style="width: 20px; height: auto;">
                        </span>
                    </div>
                    <span class="input-mensagem-erro"></span>
                </div>
                <button type="submit" value="Cadastrar" id="btnSubmit" class="formulario__loggedout--botao btn">Cadastrar</button>
            </form>
        </section>
    </main>
    <footer class="rodape">
        <p>2025 - Desenvolvido por acadêmicos do curso de Análise e Desenvolvimento de Sistemas.</p>
    </footer>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="module" src="./app.js" type="module"> </script>
    <script type="module" src="./js/Usuario/criarUsuario.js"> </script>
    <script src="./js/Usuario/custom-accessibility-widget-universal.js"></script> <!-- Atualizado para o widget universal -->
</body>
</html>
